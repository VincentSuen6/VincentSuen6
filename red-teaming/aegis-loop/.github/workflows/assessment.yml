name: AegisLoop — Automated Purple Team Assessment

on:
  schedule:
    - cron: "0 3 * * 1"          # Weekly: Mondays at 03:00 UTC
  workflow_dispatch:               # Manual trigger from GitHub Actions UI
    inputs:
      target_url:
        description: "Override target URL (leave blank for default)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  assess:
    name: Run Assessment Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Start infrastructure
        run: docker compose up -d
        working-directory: red-teaming/aegis-loop

      - name: Wait for services to be healthy
        run: |
          echo "Waiting for Juice Shop..."
          timeout 90 bash -c 'until docker inspect --format="{{.State.Health.Status}}" juice_shop_target 2>/dev/null | grep -q healthy; do sleep 5; done'
          echo "Waiting for WAF..."
          timeout 60 bash -c 'until docker inspect --format="{{.State.Health.Status}}" modsecurity_waf 2>/dev/null | grep -q healthy; do sleep 5; done'
        working-directory: red-teaming/aegis-loop

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"
        working-directory: red-teaming/aegis-loop

      - name: Run assessment
        env:
          AEGIS_TARGET_URL: ${{ inputs.target_url || 'http://localhost:8080' }}
          AEGIS_ASSESSOR: "CI/CD Pipeline"
        run: python -m aegisloop run
        working-directory: red-teaming/aegis-loop

      - name: Upload reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: aegisloop-reports-${{ github.run_id }}
          path: |
            red-teaming/aegis-loop/reports/
            red-teaming/aegis-loop/navigator-data/purple_matrix.json
          retention-days: 90

      - name: Tear down infrastructure
        if: always()
        run: docker compose down
        working-directory: red-teaming/aegis-loop
