[project]
name = "c2-lab"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "requests>=2.32",
    "pydantic>=2.7",
]

[project.optional-dependencies]
bridge = ["frida>=16.0", "psutil>=5.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
