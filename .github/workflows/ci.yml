name: SOC Pipeline CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install \
            fastapi uvicorn requests python-dotenv \
            anthropic langgraph \
            flake8 black

      # ── Code quality ─────────────────────────────────────────────────────────
      - name: Lint with flake8
        run: |
          flake8 \
            agentic-SOC-operator/soar-hub/ \
            agentic-SOC-operator/SOAR-sentinel/vuln-intel-agent/response/ \
            agentic-SOC-operator/SOAR-sentinel/vuln-intel-agent/detection/ \
            agentic-SOC-operator/SOAR-sentinel/vuln-intel-agent/intelligence/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503 \
            --exclude=venv,__pycache__,.git

      - name: Check formatting with black (non-blocking)
        run: |
          black --check --line-length=120 \
            agentic-SOC-operator/soar-hub/ \
            agentic-SOC-operator/SOAR-sentinel/vuln-intel-agent/response/ \
            || echo "⚠️  Black formatting issues found — run 'black .' locally to auto-fix"
        continue-on-error: true

      # ── Unit tests (mock mode — no live services needed) ─────────────────────
      - name: Run SOAR pipeline unit tests
        env:
          # Prevent any real API calls in CI — keys intentionally blank
          ANTHROPIC_API_KEY: ""
          ABUSEIPDB_KEY: ""
          DISCORD_WEBHOOK_URL: ""
          SLACK_WEBHOOK_URL: ""
          DRY_RUN: "true"
          GITHUB_TOKEN: ""
          GITHUB_REPO: ""
        run: |
          python agentic-SOC-operator/soar-hub/test_pipeline.py

      # ── Detection rules validation ────────────────────────────────────────────
      - name: Validate Wazuh XML rules
        run: |
          python - <<'EOF'
          import xml.etree.ElementTree as ET
          from pathlib import Path
          rules_dir = Path("agentic-SOC-operator/SIEM-Detection/wazuh")
          errors = []
          for xml_file in rules_dir.glob("*.xml"):
              try:
                  ET.parse(xml_file)
                  print(f"  OK  {xml_file.name}")
              except ET.ParseError as e:
                  errors.append(f"  ERR {xml_file.name}: {e}")
                  print(f"  ERR {xml_file.name}: {e}")
          if errors:
              raise SystemExit(f"{len(errors)} XML file(s) failed validation")
          print(f"All {len(list(rules_dir.glob('*.xml')))} Wazuh rules valid")
          EOF

      - name: Validate Elastic detection rules JSON
        run: |
          python - <<'EOF'
          import json
          from pathlib import Path
          rules_dir = Path("agentic-SOC-operator/SIEM-Detection/elastic")
          errors = []
          total_rules = 0
          for json_file in rules_dir.glob("*.json"):
              try:
                  content = json.loads(json_file.read_text())
                  rules = content if isinstance(content, list) else [content]
                  for rule in rules:
                      assert "name" in rule,     f"Missing 'name' in {json_file.name}"
                      assert "type" in rule,     f"Missing 'type' in {json_file.name}"
                      assert "severity" in rule, f"Missing 'severity' in {json_file.name}"
                      assert "query" in rule,    f"Missing 'query' in {json_file.name}"
                      total_rules += 1
                  print(f"  OK  {json_file.name} ({len(rules)} rules)")
              except (json.JSONDecodeError, AssertionError) as e:
                  errors.append(str(e))
                  print(f"  ERR {e}")
          if errors:
              raise SystemExit(f"{len(errors)} Elastic rule file(s) failed validation")
          print(f"All {total_rules} Elastic detection rules valid")
          EOF

      - name: Validate deploy script syntax
        run: |
          python -m py_compile .github/scripts/deploy_rules.py
          echo "deploy_rules.py syntax OK"

  # ── Detection-as-Code deploy (only on push to main) ──────────────────────────
  deploy-rules:
    name: Deploy Detection Rules
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install deploy dependencies
        run: pip install requests urllib3

      - name: Deploy detection rules to Wazuh / Splunk / Elastic
        env:
          WAZUH_IP:         ${{ secrets.WAZUH_IP }}
          WAZUH_API_USER:   ${{ secrets.WAZUH_API_USER }}
          WAZUH_API_PASS:   ${{ secrets.WAZUH_API_PASS }}
          ELASTIC_IP:       ${{ secrets.ELASTIC_IP }}
          ELASTIC_USER:     ${{ secrets.ELASTIC_USER }}
          ELASTIC_PASS:     ${{ secrets.ELASTIC_PASS }}
          KIBANA_IP:        ${{ secrets.KIBANA_IP }}
          SPLUNK_IP:        ${{ secrets.SPLUNK_IP }}
          SPLUNK_REST_USER: ${{ secrets.SPLUNK_REST_USER }}
          SPLUNK_REST_PASS: ${{ secrets.SPLUNK_REST_PASS }}
        run: python .github/scripts/deploy_rules.py
