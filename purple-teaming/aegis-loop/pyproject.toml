[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "aegisloop"
version = "1.0.0"
description = "Continuous Adversarial Exploitation & Automated Security Control Validation Pipeline"
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "pydantic>=2.5",
    "pydantic-settings>=2.1",
    "urllib3>=2.1",
    "jinja2>=3.1",
    "rich>=13.7",
    "typer>=0.9",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "pytest-mock>=3.12", "black>=23", "ruff>=0.1", "mypy>=1.7"]

[project.scripts]
aegisloop = "aegisloop.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
ignore_missing_imports = true
